<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 8; ry: 8; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #fff; text-anchor: middle; }
      .text-small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #fff; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .arrow-label-red { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #ef4444; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- BRIEFING -->
  <rect class="box" x="30" y="110" width="120" height="50" fill="#6366f1" stroke="#4f46e5" stroke-width="2" />
  <text class="text" x="90" y="141">BRIEFING</text>

  <!-- CEO REVIEW -->
  <rect class="box" x="220" y="40" width="140" height="50" fill="#3b82f6" stroke="#1e40af" stroke-width="2" />
  <text class="text" x="290" y="65">CEO</text>
  <text class="text-small" x="290" y="80">REVIEW</text>

  <!-- ENG REVIEW -->
  <rect class="box" x="430" y="40" width="140" height="50" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
  <text class="text" x="500" y="65">ENG</text>
  <text class="text-small" x="500" y="80">REVIEW</text>

  <!-- DESIGN REVIEW -->
  <rect class="box" x="640" y="40" width="140" height="50" fill="#ec4899" stroke="#be185d" stroke-width="2" />
  <text class="text" x="710" y="65">DESIGN</text>
  <text class="text-small" x="710" y="80">REVIEW</text>

  <!-- PRD -->
  <rect class="box" x="800" y="110" width="70" height="50" fill="#10b981" stroke="#059669" stroke-width="2" />
  <text class="text" x="835" y="141">PRD</text>

  <!-- CUT -->
  <rect class="box" x="430" y="200" width="140" height="50" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
  <text class="text" x="500" y="231">CUT</text>

  <!-- Arrows: Main flow -->
  <line class="arrow" x1="150" y1="125" x2="215" y2="70" />
  <line class="arrow" x1="360" y1="65" x2="425" y2="65" />
  <line class="arrow" x1="570" y1="65" x2="635" y2="65" />
  <line class="arrow" x1="780" y1="75" x2="810" y2="110" />

  <!-- approved labels -->
  <text class="arrow-label" x="395" y="58">approved</text>
  <text class="arrow-label" x="605" y="58">approved</text>

  <!-- Rejection arrows -->
  <!-- CEO -> CUT -->
  <path d="M 290 90 C 290 180, 430 220, 425 225" class="arrow-red" />
  <text class="arrow-label-red" x="340" y="170">rejected</text>

  <!-- ENG -> CUT -->
  <line class="arrow-red" x1="500" y1="90" x2="500" y2="195" />
  <text class="arrow-label-red" x="530" y="145">rejected</text>

  <!-- DESIGN -> CUT -->
  <path d="M 710 90 C 710 180, 575 220, 570 225" class="arrow-red" />
  <text class="arrow-label-red" x="660" y="170">rejected</text>
</svg>
