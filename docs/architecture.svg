<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 6; ry: 6; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #fff; text-anchor: middle; }
      .text-sm { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #fff; text-anchor: middle; }
      .group-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #1e293b; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- IDEs Group -->
  <rect x="30" y="30" width="200" height="260" rx="12" ry="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="4" />
  <text class="group-label" x="130" y="55">IDEs</text>

  <!-- IDE boxes -->
  <rect class="box" x="50" y="70" width="160" height="30" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" />
  <text class="text-sm" x="130" y="90">Claude Code</text>

  <rect class="box" x="50" y="110" width="160" height="30" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" />
  <text class="text-sm" x="130" y="130">OpenCode</text>

  <rect class="box" x="50" y="150" width="160" height="30" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" />
  <text class="text-sm" x="130" y="170">Cursor</text>

  <rect class="box" x="50" y="190" width="160" height="30" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" />
  <text class="text-sm" x="130" y="210">Windsurf</text>

  <rect class="box" x="50" y="230" width="160" height="30" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" />
  <text class="text-sm" x="130" y="250">Aider / Gemini CLI</text>

  <!-- OMA Group -->
  <rect x="300" y="30" width="260" height="260" rx="12" ry="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="4" />
  <text class="group-label" x="430" y="55">OneManAgency</text>

  <!-- OMA boxes -->
  <rect class="box" x="320" y="70" width="220" height="30" fill="#059669" stroke="#047857" stroke-width="1.5" />
  <text class="text-sm" x="430" y="90">/oma-init</text>

  <rect class="box" x="320" y="110" width="220" height="30" fill="#059669" stroke="#047857" stroke-width="1.5" />
  <text class="text-sm" x="430" y="130">/client-onboarding</text>

  <rect class="box" x="320" y="150" width="220" height="30" fill="#059669" stroke="#047857" stroke-width="1.5" />
  <text class="text-sm" x="430" y="170">/pipeline-generator</text>

  <rect class="box" x="320" y="190" width="220" height="30" fill="#059669" stroke="#047857" stroke-width="1.5" />
  <text class="text-sm" x="430" y="210">/oma-executor</text>

  <rect class="box" x="320" y="230" width="220" height="30" fill="#059669" stroke="#047857" stroke-width="1.5" />
  <text class="text-sm" x="430" y="250">/oma-verify-work</text>

  <!-- Agents Group -->
  <rect x="630" y="30" width="240" height="260" rx="12" ry="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" />
  <text class="group-label" x="750" y="55">17 Agents</text>

  <!-- Agent boxes -->
  <rect class="box" x="650" y="70" width="200" height="30" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
  <text class="text-sm" x="750" y="90">Frontend</text>

  <rect class="box" x="650" y="110" width="200" height="30" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
  <text class="text-sm" x="750" y="130">Backend</text>

  <rect class="box" x="650" y="150" width="200" height="30" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
  <text class="text-sm" x="750" y="170">Database</text>

  <rect class="box" x="650" y="190" width="200" height="30" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
  <text class="text-sm" x="750" y="210">DevOps</text>

  <rect class="box" x="650" y="230" width="200" height="30" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
  <text class="text-sm" x="750" y="250">Security + 12 more</text>

  <!-- Arrows between groups -->
  <line class="arrow" x1="230" y1="160" x2="295" y2="160" />
  <line class="arrow" x1="560" y1="160" x2="625" y2="160" />
</svg>
