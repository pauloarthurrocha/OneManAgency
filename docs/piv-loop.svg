<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 8; ry: 8; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #fff; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- PLAN box -->
  <rect class="box" x="50" y="60" width="140" height="50" fill="#3b82f6" stroke="#1e40af" stroke-width="2" />
  <text class="text" x="120" y="91">PLAN</text>

  <!-- IMPLEMENT box -->
  <rect class="box" x="250" y="60" width="140" height="50" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
  <text class="text" x="320" y="91">IMPLEMENT</text>

  <!-- VALIDATE box -->
  <rect class="box" x="450" y="60" width="140" height="50" fill="#10b981" stroke="#059669" stroke-width="2" />
  <text class="text" x="520" y="91">VALIDATE</text>

  <!-- SHIP box -->
  <rect class="box" x="650" y="60" width="100" height="50" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2" />
  <text class="text" x="700" y="91">SHIP</text>

  <!-- Arrows -->
  <line class="arrow" x1="190" y1="85" x2="245" y2="85" />
  <line class="arrow" x1="390" y1="85" x2="445" y2="85" />
  <line class="arrow" x1="590" y1="85" x2="645" y2="85" />

  <!-- /clear label -->
  <text class="arrow-label" x="217" y="75">/clear</text>

  <!-- pass label -->
  <text class="arrow-label" x="617" y="75">pass</text>

  <!-- fail arrow (curved back) -->
  <path d="M 520 110 C 520 150, 120 150, 120 115" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text class="arrow-label" x="320" y="145" fill="#ef4444">fail</text>
</svg>
